<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>توك توك الدائري - نموذج أولي</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb5c7;font-family:system-ui,Tahoma,Arial}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000;z-index:2}
.pill{position:absolute;top:12px;background:#101820c9;border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;font-weight:800}
#title{right:12px;font-size:14px}
#stats{left:12px;direction:rtl;text-align:left;font-size:13px;line-height:1.7}
#hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#101820b8;border-radius:10px;padding:7px 12px;font-size:12px;white-space:nowrap}
#touch{position:fixed;inset:auto 0 14px;display:flex;justify-content:space-between;align-items:end;padding:0 16px;z-index:5;pointer-events:none}
.cluster{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:64px;height:64px;border-radius:18px;border:1px solid #ffffff66;background:#14212bd9;color:white;font-size:25px;font-weight:900;box-shadow:0 5px 0 #0005;touch-action:none;user-select:none}
.ctrl:active,.ctrl.on{background:#00a9a0}
#gas{height:82px;width:72px;background:#b7442c}
#brake{height:66px;width:66px;background:#475569}
#start{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07111bd9,#07111bbd);padding:22px}
.panel{max-width:440px;background:#111b25;border:1px solid #ffffff25;border-radius:22px;padding:24px;text-align:center;color:#fff;box-shadow:0 20px 60px #0007}
.panel h1{margin:0 0 8px;font-size:27px}.panel p{color:#cbd5e1;line-height:1.8;font-size:14px}
#play{border:0;border-radius:14px;background:#f59e0b;color:#1b1306;font-size:18px;font-weight:900;padding:13px 30px}
.small{font-size:11px!important;color:#94a3b8!important}
@media(min-width:800px){.ctrl{width:70px;height:70px}#touch{padding:0 28px;bottom:22px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="title" class="pill">🛺 توك توك الدائري</div>
 <div id="stats" class="pill">السرعة: <span id="speed">0</span><br>المسافة: <span id="distance">0</span> م</div>
 <div id="hint">يمين / شمال للتوجيه • بنزين للتسارع</div>
</div>
<div id="touch">
 <div class="cluster">
  <button class="ctrl" data-control="left" aria-label="يسار">◀</button>
  <button class="ctrl" data-control="right" aria-label="يمين">▶</button>
 </div>
 <div class="cluster">
  <button class="ctrl" id="brake" data-control="brake">فرامل</button>
  <button class="ctrl" id="gas" data-control="gas">▲</button>
 </div>
</div>
<div id="start">
 <div class="panel">
  <h1>🛺 توك توك الدائري</h1>
  <p>نموذج أولي ثلاثي الأبعاد مستوحى من الدائري والعمارات المصرية.<br>اسوق بين العربيات وجرب التحكم باللمس.</p>
  <button id="play">ابدأ اللعب</button>
  <p class="small">نسخة تجريبية: المجسم الحالي مؤقت، وسنستبدله بملف التوك توك الخاص بك بعد تجهيزه.</p>
 </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb5c7);
scene.fog=new THREE.Fog(0x9bb5c7,90,360);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.1,700);
camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f3ff,0x75604a,2.1));
const sun=new THREE.DirectionalLight(0xffe1b0,2.3);sun.position.set(-35,60,25);scene.add(sun);

const mats={};
function mat(name,color,roughness=0.9){return mats[name] ||= new THREE.MeshStandardMaterial({color,roughness})}
const asphalt=mat('asphalt',0x34383a), concrete=mat('concrete',0xb4afa4), darkConcrete=mat('darkConcrete',0x777a78),
 white=mat('white',0xe5e0d5), yellow=mat('yellow',0xf3bf32), black=mat('black',0x17191b),
 windowMat= new THREE.MeshStandardMaterial({color:0x465c64,roughness:.35,metalness:.15}),
 fadedBlue=mat('blue',0x7f9b9c), fadedPink=mat('pink',0xb78e7b), fadedSand=mat('sand',0xc3ad88),
 fadedGray=mat('gray',0xaaa49a), red=mat('red',0xb72f25), green=mat('green',0x2f6b53);
function box(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);parent.add(m);return m}
function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);m.position.set(x,y,z);parent.add(m);return m}

// Long elevated ring-road deck and modular details; scene scrolls toward the player.
const road=new THREE.Group();scene.add(road);
box(road,18,0.55,420,asphalt,0,8,-150);
for(let side of [-1,1]){
 box(road,.55,1.15,420,concrete,side*9.15,8.45,-150);
 box(road,.18,.2,420,white,side*8.6,8.31,-150);
 // expansion seams and guardrail posts
 for(let z=-355;z<55;z+=12){
  box(road,.18,.65,.25,darkConcrete,side*8.85,9.1,z);
 }
 // columns and crossheads below elevated roadway
 for(let z=-350;z<45;z+=32){
  box(road,1.2,8,1.4,darkConcrete,side*5.9,3.65,z);
  box(road,14,.65,1.8,concrete,0,7.2,z);
 }
}
// Lane dashed lines
for(let x of [-4.5,0,4.5]){
 for(let z=-390;z<45;z+=12) box(road,.13,.025,5.5,yellow,x,8.29,z);
}
// Under-road city ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat('ground',0x8c806a));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.5,-160);scene.add(ground);

// Modular Egyptian apartment blocks: balcony slabs, dark windows, rooftop tanks and dishes.
const buildingMats=[fadedSand,fadedBlue,fadedPink,fadedGray,concrete];
function makeBuilding(x,z,seed){
 const g=new THREE.Group();scene.add(g);
 const floors=4+(seed%5),w=7+(seed%4)*1.5,d=8+(seed%3)*2,h=floors*3.15;
 const bm=buildingMats[seed%buildingMats.length];
 box(g,w,h,d,bm,0,h/2-0.4,0);
 // vertical facade bands
 for(let xx=-w/2+1.1;xx<w/2;xx+=2.2){
  for(let fl=0;fl<floors;fl++){
   const yy=1.0+fl*3.15;
   box(g,.95,1.25,.09,windowMat,xx,yy,d/2+.06);
   // small balcony slabs, slightly irregular
   box(g,1.35,.16,1.0,concrete,xx,yy-.63,d/2+.48);
   box(g,1.25,.62,.08,darkConcrete,xx,yy-.3,d/2+.94);
  }
 }
 // roof lip, tanks, satellite dishes
 box(g,w+.35,.25,d+.35,concrete,0,h-.15,0);
 cylinder(g,.55,.55,1.0,mat('tank'+seed,seed%2?0x777c7d:0x9b9b91),w*.2,h+.5,-d*.15,10);
 const dish=new THREE.Mesh(new THREE.SphereGeometry(.55,8,5,0,Math.PI*2,0,Math.PI/2),white);
 dish.rotation.x=Math.PI;dish.position.set(-w*.22,h+.25,d*.15);g.add(dish);
 // ground-level storefronts
 for(let xx=-w/2+1.6;xx<w/2-1;xx+=3.2){
  box(g,2.5,2.4,.13,black,xx,1.3,d/2+.1);
  box(g,2.3,.35,.16,seed%2?red:green,xx,2.75,d/2+.18);
 }
 return g;
}
for(let side of [-1,1]){
 for(let i=0;i<12;i++){
  const z=-360+i*35;
  makeBuilding(side*(26+(i%3)*5),z,i+(side===1?7:0));
  if(i%2===0) makeBuilding(side*(47+(i%4)*4),z-10,i+15+(side===1?5:0));
 }
}
// electrical poles and overhead cables on city edge
for(let side of [-1,1]){
 for(let z=-340;z<30;z+=24){
  cylinder(scene,.12,.16,8,darkConcrete,side*14,4,z,7);
  box(scene,1.6,.13,.13,darkConcrete,side*14,7.4,z);
 }
}
const cableMat=new THREE.LineBasicMaterial({color:0x343638});
for(let side of [-1,1]){
 const pts=[];for(let z=-350;z<=20;z+=15)pts.push(new THREE.Vector3(side*14,7.5+Math.sin(z*.1)*.2,z));
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),cableMat));
}

// Vehicle construction. Temporary tuk-tuk placeholder; replace group with loaded GLB later.
function makeCar(color=0xd7d5ca,isTuk=false){
 const g=new THREE.Group();
 const bodymat=new THREE.MeshStandardMaterial({color,roughness:.7});
 if(isTuk){
  box(g,1.65,.65,2.15,green,0,1.0,0);
  box(g,1.5,.9,1.25,yellow,0,1.65,-.1);
  box(g,1.28,.7,.08,windowMat,0,1.75,.55);
  box(g,1.4,.12,1.55,black,0,2.15,-.1);
  // canopy posts and canopy
  for(let x of [-.62,.62])for(let z of [-.55,.45])cylinder(g,.045,.045,1.05,black,x,1.65,z,6);
  box(g,1.55,.12,1.45,red,0,2.25,-.1);
 } else {
  box(g,1.7,.7,3.0,bodymat,0,.8,0);
  box(g,1.48,.65,1.55,windowMat,0,1.35,-.12);
  box(g,1.72,.13,1.1,bodymat,0,1.03,-.65);
 }
 // wheels
 const wheelMat=mat('rubber',0x161718), hub=mat('hub',0xaaa9a1);
 for(let x of [-.88,.88])for(let z of [-.85,.85]){
  const wh=cylinder(g,.38,.38,.22,wheelMat,x,.42,z,12);wh.rotation.z=Math.PI/2;
  const hu=cylinder(g,.18,.18,.235,hub,x,.42,z,12);hu.rotation.z=Math.PI/2;
 }
 return g;
}
const player=makeCar(0x2f8b5b,true);player.position.set(0,8.3,2);scene.add(player);
const traffic=[];
for(let i=0;i<9;i++){
 const colors=[0xe2d6bd,0x2871a8,0x9b3026,0xc4a22b,0x68736b];
 const car=makeCar(colors[i%colors.length],false);
 car.position.set([-6,-2.5,2.5,6][i%4],8.32,-35-i*36);
 car.userData.speed=8+(i%4)*2.3;scene.add(car);traffic.push(car);
}
// add some tiny roadside parked vehicles on distant shoulder? traffic enough.

const controls={left:false,right:false,gas:false,brake:false};
document.querySelectorAll('[data-control]').forEach(b=>{
 const k=b.dataset.control;
 const down=e=>{e.preventDefault();controls[k]=true;b.classList.add('on')};
 const up=e=>{e.preventDefault();controls[k]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))controls.left=true;if(['ArrowRight','d','D'].includes(e.key))controls.right=true;if(['ArrowUp','w','W',' '].includes(e.key))controls.gas=true;if(['ArrowDown','s','S'].includes(e.key))controls.brake=true;});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))controls.left=false;if(['ArrowRight','d','D'].includes(e.key))controls.right=false;if(['ArrowUp','w','W',' '].includes(e.key))controls.gas=false;if(['ArrowDown','s','S'].includes(e.key))controls.brake=false;});
let started=false,speed=0,travel=0,hitCooldown=0;
document.querySelector('#play').addEventListener('click',()=>{started=true;document.querySelector('#start').style.display='none';});
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 if(started){
  if(controls.gas)speed+=18*dt;else speed-=5*dt;
  if(controls.brake)speed-=25*dt;
  speed=clamp(speed,0,48);
  const steer=(controls.right?1:0)-(controls.left?1:0);
  player.position.x=clamp(player.position.x+steer*(3.2+speed*.12)*dt,-6.6,6.6);
  player.rotation.y=-steer*.12;
  travel+=speed*dt;
  // traffic approaches player; recycling creates endless highway feeling
  traffic.forEach((car,i)=>{
   car.position.z += (speed-car.userData.speed)*dt;
   if(car.position.z>18){car.position.z=-300-Math.random()*80;car.position.x=[-6,-2.5,2.5,6][Math.floor(Math.random()*4)];}
   if(Math.abs(car.position.z-player.position.z)<2.4 && Math.abs(car.position.x-player.position.x)<1.55 && hitCooldown<=0){
    speed*=.48;hitCooldown=1.0;
    car.position.z=-230-Math.random()*50;
   }
  });
  hitCooldown=Math.max(0,hitCooldown-dt);
  document.querySelector('#speed').textContent=Math.round(speed*2.1);
  document.querySelector('#distance').textContent=Math.floor(travel);
 }
 // Road and city move backwards relative to player to simulate forward travel
 const shift=started?travel%420:0;
 road.position.z=shift;
 // Keep buildings visually scrolling subtly, preserving world layout.
 scene.children.forEach(obj=>{
  if(obj.userData.scrollCity){obj.position.z=shift;}
 });
 const target=new THREE.Vector3(player.position.x*.32,15.2,18);
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x*.38,8.25,-32);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
