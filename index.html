
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>توك توك الدائري</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb5c7;font-family:system-ui,Tahoma,Arial}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000;z-index:2}
.pill{position:absolute;top:12px;background:#101820c9;border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;font-weight:800}
#title{right:12px;font-size:14px}
#stats{left:12px;direction:rtl;text-align:left;font-size:13px;line-height:1.7}
#hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#101820b8;border-radius:10px;padding:7px 12px;font-size:12px;white-space:nowrap}
#touch{position:fixed;inset:auto 0 14px;display:flex;justify-content:space-between;align-items:end;padding:0 16px;z-index:5;pointer-events:none}
.cluster{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:64px;height:64px;border-radius:18px;border:1px solid #ffffff66;background:#14212bd9;color:white;font-size:25px;font-weight:900;box-shadow:0 5px 0 #0005;touch-action:none;user-select:none}
.ctrl:active,.ctrl.on{background:#00a9a0}
#gas{height:82px;width:72px;background:#b7442c}
#brake{height:66px;width:66px;background:#475569}
#start{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07111bd9,#07111bbd);padding:22px}
.panel{max-width:440px;background:#111b25;border:1px solid #ffffff25;border-radius:22px;padding:24px;text-align:center;color:#fff;box-shadow:0 20px 60px #0007}
.panel h1{margin:0 0 8px;font-size:27px}
.panel p{color:#cbd5e1;line-height:1.8;font-size:14px}
#play{border:0;border-radius:14px;background:#f59e0b;color:#1b1306;font-size:18px;font-weight:900;padding:13px 30px}
.small{font-size:11px!important;color:#94a3b8!important}
@media(min-width:800px){
 .ctrl{width:70px;height:70px}
 #touch{padding:0 28px;bottom:22px}
}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 <div id="title" class="pill">🛺 توك توك الدائري</div>
 <div id="stats" class="pill">
  السرعة: <span id="speed">0</span><br>
  المسافة: <span id="distance">0</span> م
 </div>
 <div id="hint">يمين / شمال للتوجيه • بنزين للتسارع</div>
</div>

<div id="touch">
 <div class="cluster">
  <button class="ctrl" data-control="left" aria-label="يسار">◀</button>
  <button class="ctrl" data-control="right" aria-label="يمين">▶</button>
 </div>
 <div class="cluster">
  <button class="ctrl" id="brake" data-control="brake">فرامل</button>
  <button class="ctrl" id="gas" data-control="gas">▲</button>
 </div>
</div>

<div id="start">
 <div class="panel">
  <h1>🛺 توك توك الدائري</h1>
  <p>طريق دائري ثلاثي الأبعاد من غير مباني.<br>اسوق بين العربيات وجرب التحكم باللمس.</p>
  <button id="play">ابدأ اللعب</button>
  <p class="small">نسخة تجريبية قابلة للتطوير.</p>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { createEgyptianBuildings } from './buildings.js';
const root=document.querySelector('#game');

const scene=new THREE.Scene();
 const roadsideBuildings=createEgyptianBuildings(scene);
scene.background=new THREE.Color(0x9bb5c7);
scene.fog=new THREE.Fog(0x9bb5c7,90,360);

const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.1,700);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f3ff,0x75604a,2.1));

const sun=new THREE.DirectionalLight(0xffe1b0,2.3);
sun.position.set(-35,60,25);
scene.add(sun);

const mats={};

function mat(name,color,roughness=0.9){
 return mats[name] ||= new THREE.MeshStandardMaterial({color,roughness});
}

const asphalt=mat('asphalt',0x34383a);
const concrete=mat('concrete',0xb4afa4);
const darkConcrete=mat('darkConcrete',0x777a78);
const white=mat('white',0xe5e0d5);
const yellow=mat('yellow',0xf3bf32);
const black=mat('black',0x17191b);
const windowMat=new THREE.MeshStandardMaterial({
 color:0x465c64,
 roughness:.35,
 metalness:.15
});
const red=mat('red',0xb72f25);
const green=mat('green',0x2f6b53);

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,segments),
  material
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

// الطريق الرئيسي والحواجز فقط، بدون مباني أو أعمدة أو أسلاك.
const road=new THREE.Group();
scene.add(road);

// سطح الطريق
box(road,18,0.55,420,asphalt,0,8,-150);

// الحواجز الخرسانية الجانبية
for(const side of [-1,1]){
 box(
  road,.55,1.15,420,
  concrete,side*9.15,8.45,-150
 );

 // الخط الأبيض بجوار الحاجز
 box(
  road,.18,.2,420,
  white,side*8.6,8.31,-150
 );
}

// الخطوط الصفراء المتقطعة
for(const x of [-4.5,0,4.5]){
 for(let z=-390;z<45;z+=12){
  box(
   road,.13,.025,5.5,
   yellow,x,8.29,z
  );
 }
}

// نسخة ثانية من الطريق لمنع الاختفاء عند نهاية الدورة
const roadLoop = road.clone(true);
roadLoop.position.z = -420;
scene.add(roadLoop);

// نسخة ثانية من العمارات لاستمرار المشهد
const roadsideBuildingsLoop = roadsideBuildings.clone(true);
roadsideBuildingsLoop.position.z = -420;
scene.add(roadsideBuildingsLoop);

// إنشاء التوك توك والعربيات
function makeCar(color=0xd7d5ca,isTuk=false){
 const g=new THREE.Group();

 const bodymat=new THREE.MeshStandardMaterial({
  color,
  roughness:.7
 });

 if(isTuk){
  // جسم التوك توك
  box(g,1.65,.65,2.15,green,0,1.0,0);
  box(g,1.5,.9,1.25,yellow,0,1.65,-.1);
  box(g,1.28,.7,.08,windowMat,0,1.75,.55);
  box(g,1.4,.12,1.55,black,0,2.15,-.1);

  // سقف التوك توك
  for(const x of [-.62,.62]){
   for(const z of [-.55,.45]){
    cylinder(g,.045,.045,1.05,black,x,1.65,z,6);
   }
  }

  box(g,1.55,.12,1.45,red,0,2.25,-.1);

 }else{
  // جسم السيارات الأخرى
  box(g,1.7,.7,3.0,bodymat,0,.8,0);
  box(g,1.48,.65,1.55,windowMat,0,1.35,-.12);
  box(g,1.72,.13,1.1,bodymat,0,1.03,-.65);
 }

 // العجلات
 const wheelMat=mat('rubber',0x161718);
 const hub=mat('hub',0xaaa9a1);

 for(const x of [-.88,.88]){
  for(const z of [-.85,.85]){
   const wh=cylinder(
    g,.38,.38,.22,wheelMat,
    x,.42,z,12
   );
   wh.rotation.z=Math.PI/2;

   const hu=cylinder(
    g,.18,.18,.235,hub,
    x,.42,z,12
   );
   hu.rotation.z=Math.PI/2;
  }
 }

 return g;
}

// مكان اللاعب
const player=makeCar(0x2f8b5b,true);
player.position.set(0,8.3,2);
scene.add(player);

// سيارات المرور
const traffic=[];

for(let i=0;i<9;i++){
 const colors=[
  0xe2d6bd,
  0x2871a8,
  0x9b3026,
  0xc4a22b,
  0x68736b
 ];

 const car=makeCar(colors[i%colors.length],false);

 car.position.set(
  [-6,-2.5,2.5,6][i%4],
  8.32,
  -35-i*36
 );

 car.userData.speed=8+(i%4)*2.3;

 scene.add(car);
 traffic.push(car);
}

// أزرار التحكم
const controls={
 left:false,
 right:false,
 gas:false,
 brake:false
};

document.querySelectorAll('[data-control]').forEach(b=>{
 const k=b.dataset.control;

 const down=e=>{
  e.preventDefault();
  controls[k]=true;
  b.classList.add('on');
 };

 const up=e=>{
  e.preventDefault();
  controls[k]=false;
  b.classList.remove('on');
 };

 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('pointerleave',up);
});

// التحكم من لوحة المفاتيح
addEventListener('keydown',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))controls.left=true;
 if(['ArrowRight','d','D'].includes(e.key))controls.right=true;
 if(['ArrowUp','w','W',' '].includes(e.key))controls.gas=true;
 if(['ArrowDown','s','S'].includes(e.key))controls.brake=true;
});

addEventListener('keyup',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))controls.left=false;
 if(['ArrowRight','d','D'].includes(e.key))controls.right=false;
 if(['ArrowUp','w','W',' '].includes(e.key))controls.gas=false;
 if(['ArrowDown','s','S'].includes(e.key))controls.brake=false;
});

let started=false;
let speed=0;
let travel=0;
let hitCooldown=0;

document.querySelector('#play').addEventListener('click',()=>{
 started=true;
 document.querySelector('#start').style.display='none';
});

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.035);

 if(started){
  // التسارع والفرامل
  if(controls.gas)speed+=18*dt;
  else speed-=5*dt;

  if(controls.brake)speed-=25*dt;

  speed=clamp(speed,0,48);

  // التوجيه يمين وشمال
  const steer=
   (controls.right?1:0)-
   (controls.left?1:0);

  player.position.x=clamp(
   player.position.x+
   steer*(3.2+speed*.12)*dt,
   -6.6,
   6.6
  );

  player.rotation.y=-steer*.12;

  travel+=speed*dt;

  // حركة السيارات وإعادة ظهورها
  traffic.forEach((car,i)=>{
   car.position.z+=(speed-car.userData.speed)*dt;

   if(car.position.z>18){
    car.position.z=-300-Math.random()*80;
    car.position.x=
     [-6,-2.5,2.5,6][Math.floor(Math.random()*4)];
   }

   // التصادم مع السيارات
   if(
    Math.abs(car.position.z-player.position.z)<2.4 &&
    Math.abs(car.position.x-player.position.x)<1.55 &&
    hitCooldown<=0
   ){
    speed*=.48;
    hitCooldown=1.0;
    car.position.z=-230-Math.random()*50;
   }
  });

  hitCooldown=Math.max(0,hitCooldown-dt);

  document.querySelector('#speed').textContent=
   Math.round(speed*2.1);

  document.querySelector('#distance').textContent=
   Math.floor(travel);
 }

 // حركة الطريق لمحاكاة القيادة للأمام
 const shift=started?travel%420:0;
 road.position.z=shift;
roadLoop.position.z=shift-420;

roadsideBuildings.position.z=shift;
roadsideBuildingsLoop.position.z=shift-420;
 // كاميرا خلف التوك توك
 const target=new THREE.Vector3(
  player.position.x*.32,
  15.2,
  18
 );

 camera.position.lerp(
  target,
  1-Math.pow(.001,dt)
 );

 camera.lookAt(
  player.position.x*.38,
  8.25,
  -32
 );

 renderer.render(scene,camera);
}

animate();

// ضبط الشاشة عند تغيير حجمها
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
